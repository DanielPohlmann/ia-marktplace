name: verify-marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify marketplace conventions
        run: python scripts/verify_marketplace.py
      - name: Verifier unit tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
